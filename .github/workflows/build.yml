name: build-lsdriver-4.9

# 为一加6（enchilada，氢OS Android 10，内核 4.9.179-perf+）云编译 lsdriver.ko
# 手动触发：GitHub 网页 → Actions → build-lsdriver-4.9 → Run workflow

"on":
  workflow_dispatch:
    inputs:
      localversion:
        description: 'vermagic 后缀。defconfig 已带 -perf，默认填 + 使结果为 4.9.179-perf+（对齐 adb shell uname -r）'
        required: false
        default: '+'
      clean_diag:
        description: '诊断：跳过全部源码补丁（仅基线+关模块强制签名+imem_reader），验证自研内核基线能否开机并读IMEM'
        type: boolean
        default: false
      initcall_max:
        description: '二分法：只跑前N个initcall level(0-7)。99=跑全部。0=early,1=core,2=postcore,3=arch,4=subsys,5=fs,6=device,7=late'
        required: false
        default: '99'

env:
  KERNEL_REPO: https://github.com/OnePlusOSS/android_kernel_oneplus_sdm845.git
  KERNEL_BRANCH: oneplus/SDM845_Q_10.0

jobs:
  build:
    # ubuntu-22.04 自带 gcc-11 交叉工具链：认识 armv8.6-a（驱动 Makefile 需要），又对 4.9 老内核友好。
    # 原厂内核为 gcc 4.9 编译（/proc/version 实证），clang 路线不走。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout lsdriver source
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu device-tree-compiler python2 ccache file \
            libc6-i386 lib32stdc++6
          # 4.9 内核的 scripts/gcc-wrapper.py 是 Python2 语法（print >> sys.stderr），
          # 其 shebang 为 #!/usr/bin/env python，需要把 python 指到 python2
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          # 内核编译用 ccache 需要放开时间宏检查（否则 __TIME__ 等导致误判不命中）
          echo "CCACHE_SLOPPINESS=time_macros" >> "$GITHUB_ENV"

      # ccache：内核编译结果缓存，重跑时未变文件直接命中，20分钟 → 几分钟
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Clone OnePlus 4.9 kernel (shallow)
        run: git clone --depth 1 --branch "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_REPO }}" kernel

      # 关键：原厂内核(/proc/version)由 Google aarch64 gcc-4.9 编译。新 gcc-11 编 4.9 内核
      # 能过但可能在启动早期产生致命异常。内核用与原厂一致的 gcc-4.9，保证启动行为对齐。
      - name: Get stock-matching aarch64 gcc-4.9 toolchain
        run: |
          git clone --depth 1 --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$HOME/tc49"
          GCC="$HOME/tc49/bin/aarch64-linux-android-gcc"
          echo '--- clone result ---'
          du -sh "$HOME/tc49"
          ls -la "$GCC"
          echo '--- ELF type / interpreter ---'
          file "$GCC"
          readelf -l "$GCC" | grep -A1 INTERP || true
          echo '--- try exec (no pipe masking) ---'
          "$GCC" --version
          echo "KERNEL_CC=$GCC" >> "$GITHUB_ENV"
          echo "KERNEL_CROSS=$HOME/tc49/bin/aarch64-linux-android-" >> "$GITHUB_ENV"

      # OnePlusOSS 公开树不完整：drivers/Kconfig 引用但缺失 drivers/oneplus/。
      # 通用兜底：把所有 Kconfig 里 source 了但文件不存在的路径补成空 Kconfig。
      - name: Stub missing vendor Kconfigs
        run: |
          cd kernel
          mkdir -p drivers/oneplus
          [ -f drivers/oneplus/Kconfig ] || echo '# stub: OnePlusOSS 公开树未包含此目录' > drivers/oneplus/Kconfig
          # drivers/Makefile 无条件 obj-y += oneplus/，空 Makefile 不会生成 built-in.o 导致父链接失败，
          # 用一个空 .c 产出空 built-in.o
          echo 'obj-y += op_stub.o' > drivers/oneplus/Makefile
          echo '/* empty stub */' > drivers/oneplus/op_stub.c
          grep -rhoP 'source\s+"\K[^"]+' --include=Kconfig . | sort -u | while read -r f; do
            case "$f" in *'$'*) continue;; esac
            if [ ! -f "$f" ]; then
              mkdir -p "$(dirname "$f")"
              echo '# stub: missing in OnePlusOSS release' > "$f"
              echo "stubbed: $f"
            fi
          done
          # fair.c 等内核文件无条件 include drivers/oneplus/ 下的头文件，批量补空头文件
          grep -rhoP '#include\s*[<"]\K(\.\./)*drivers/oneplus/[^">]+\.h' --include='*.c' --include='*.h' . \
            | sed 's|^\(\.\./\)*||' | sort -u | while read -r f; do
            if [ ! -f "$f" ]; then
              mkdir -p "$(dirname "$f")"
              echo '/* stub: missing in OnePlusOSS release */' > "$f"
              echo "stubbed header: $f"
            fi
          done
          # fair.c 实际调用 opchain 函数，空头文件会 implicit declaration，
          # 需要中性实现桩（is_opc_task 恒 false、opc_cpu_util 原样返回=关闭 opchain 增强，
          # 不改导出符号，对 Module.symvers/CRC 无影响；我们不刷这个内核）
          # 用 printf 而非 heredoc：heredoc 要求 EOF 顶格，与 YAML 缩进冲突
          mkdir -p drivers/oneplus/coretech/uxcore
          printf '%s\n' \
            '/* stub: OnePlusOSS 公开树未包含 opchain 实现，中性实现保证编译通过 */' \
            '#ifndef _OPCHAIN_HELPER_H' \
            '#define _OPCHAIN_HELPER_H' \
            '#include <linux/types.h>' \
            'struct task_struct;' \
            '#define UT_FORE 0' \
            '#define UT_BACK 1' \
            '#ifndef FIRST_BIG_CORE' \
            '#define FIRST_BIG_CORE 4 /* sdm845: cpu0-3 little, cpu4-7 big */' \
            '#endif' \
            'static inline void opc_task_switch(bool enqueue, int cpu, struct task_struct *p, int flags) {}' \
            'static inline unsigned long opc_cpu_util(unsigned long util, int cpu, struct task_struct *p, int path) { return util; }' \
            'static inline bool is_opc_task(struct task_struct *p, int type) { return false; }' \
            'static inline int opc_select_path(struct task_struct *cur, struct task_struct *p, int prev_cpu) { return -1; }' \
            'static inline int opc_get_claim_on_cpu(int cpu) { return 0; }' \
            'static __maybe_unused int *opc_boost_tl = 0;' \
            'static inline void opc_binder_pass(size_t size, void *kptr, int dir) {}' \
            '#endif' \
            > drivers/oneplus/coretech/uxcore/opchain_helper.h

      # 公开树缺一加私有函数实现（get_boot_mode/is_fg/param 分区接口），
      # 用中性桩编入 drivers/oneplus/，保证链接完整且正常开机路径安全
      - name: Add neutral vendor symbol stubs
        run: |
          cp kernel-patches/op_vendor_stubs.c kernel/drivers/oneplus/op_vendor_stubs.c
          echo 'obj-y += op_vendor_stubs.o' >> kernel/drivers/oneplus/Makefile

      # 诊断：极早期 panic 捕获器（ramoops 就绪前直接写物理内存），恢复端扫 magic 读栈
      - name: Add early crash dumper
        if: inputs.clean_diag != true
        run: |
          cp kernel-patches/early_crash_dump.c kernel/drivers/oneplus/early_crash_dump.c
          echo 'obj-y += early_crash_dump.o' >> kernel/drivers/oneplus/Makefile

      # 诊断：traps.c 在 panic 前调用 lsd_capture(regs)，确保拿到寄存器现场
      - name: Hook traps oops_end to lsd_capture
        if: inputs.clean_diag != true
        run: |
          cd kernel
          python3 ../kernel-patches/apply_traps_capture.py

      # 诊断：panic 重启改走 bootloader 热复位（清dload magic + 0x77665500），
      # 自动进 fastboot 且 RAM 不断电，恢复后 pstore 记录仍在
      - name: Make panic warm-reboot into fastboot
        if: inputs.clean_diag != true
        run: |
          cd kernel
          python3 ../kernel-patches/apply_poweroff_fastboot.py

      # 诊断：initcall level 二分法。内核参数 lsd_initcall_max=N 控制只跑前 N 个 level。
      - name: Initcall level bisect support
        if: inputs.clean_diag != true
        run: |
          cd kernel
          python3 ../kernel-patches/apply_initcall_bisect.py

      # 修复真机早期 "Kernel BUG at kfree/free_task"（rcuop 回收内核线程时）。
      # 公开树无 config OPCHAIN，defconfig 的 =y 被 olddefconfig 丢弃，dup_task_struct
      # 里 tsk->nn=NULL 被宏编译掉，而 nn 的分配/释放未加保护，内核线程 nn 成垃圾。
      - name: Fix unguarded nn init (OPCHAIN undefined in public tree)
        run: |
          cd kernel
          python3 ../kernel-patches/apply_nn_init.py

      # 诊断：抓"静默卡死"（panic、无USB、屏幕冻结）。在内核启动各阶段往 IMEM
      # 写进度编号，冷启动后用 imem_reader 模块读出，确定死亡位置。
      - name: Add IMEM boot-stage tracing
        if: inputs.clean_diag != true
        run: |
          cp kernel-patches/lsd_bootstage.h kernel/include/linux/lsd_bootstage.h
          cd kernel
          python3 ../kernel-patches/apply_bootstage_asm.py
          python3 ../kernel-patches/apply_bootstage_c.py

      # OnePlusOSS 公开树通病：厂商 trace 头里 #define TRACE_INCLUDE_PATH .，
      # define_trace.h 在 include/trace/ 下按 "./xxx.h" 解析，找不到本目录头。
      # 通用修法：把 "." 替换为从 include/trace 到该头文件目录的相对路径
      - name: Fix vendor TRACE_INCLUDE_PATH
        run: |
          cd kernel
          python3 -c '
          import os, re
          pat = re.compile(r"^#define\s+TRACE_INCLUDE_PATH\s+\.\s*$", re.M)
          fixed = 0
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d != ".git"]
              for f in files:
                  if not f.endswith(".h"):
                      continue
                  p = os.path.join(root, f)
                  t = open(p, errors="ignore").read()
                  if pat.search(t):
                      rel = os.path.relpath(root, "include/trace").replace(os.sep, "/")
                      t = pat.sub("#define TRACE_INCLUDE_PATH " + rel, t, count=1)
                      open(p, "w").write(t)
                      fixed += 1
          print("patched trace headers:", fixed)
          '

      # 4.9 in-tree 编译不给 -I 当前源码目录(Makefile.lib KBUILD_SRC 分支)，
      # 厂商代码 <function/u_ncm.h> 尖括号找不到，补 -I
      - name: Fix gadget/kgsl include path
        run: |
          cd kernel
          python3 -c 'p="drivers/usb/gadget/Makefile"; t=open(p).read(); t += "\nccflags-y += -I$(srctree)/drivers/usb/gadget\n"; open(p,"w").write(t)'
          # KGSL Makefile 只有 -Iinclude/linux；kgsl_events.c 用尖括号 <kgsl_device.h> 引用同目录头，
          # kbuild 默认不把源码目录加入 -I，追加 -I$(src)（对子目录同样生效）
          python3 -c 'p="drivers/gpu/msm/Makefile"; t=open(p).read(); t += "\nccflags-y += -I$(src)\n"; open(p,"w").write(t)'

      - name: Configure kernel (stock_sdm845.config)
        run: |
          cd kernel
          # 用 stock 内核的完整 .config 代替 sdm845-perf_defconfig，
          # 最大限度保留原厂配置（SCM/SPMI/GDSC/UFS_PHY 等 defconfig 缺失的关键项）
          cp ../stock_sdm845.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          # 关闭 SCM 自动后缀，保证可复现
          scripts/config --disable LOCALVERSION_AUTO || true
          # OnePlusOSS 公开树坑：BTFM_SLIM 默认随 MSM_BT_POWER 打开，但 <btfm_slim.h> 缺 include 路径，编不过。
          # 我们只要 Module.symvers 的 CRC，蓝牙驱动无关，直接关掉
          scripts/config --disable BTFM_SLIM --disable BTFM_SLIM_WCN3990 || true
          # 此内核要真机启动：显示(SDE)/GPU(KGSL)/MDSS_PLL 必须保留（defconfig 本就开启，禁止 disable）。
          # 仅禁用与开机无关、且公开树缺头的多媒体（相机/视频/音频），需要时再逐个修复
          scripts/config --disable SPECTRA_CAMERA || true
          scripts/config --disable MSMB_CAMERA || true
          # SDE rotator 是显示旋转管线（sde_hw_rot.c 直接调用其 inline 接口），
          # 必须启用真实驱动；它只依赖 VIDEO_V4L2 核心框架，与相机无关
          scripts/config --enable VIDEO_V4L2 --enable MSM_SDE_ROTATOR || true
          scripts/config --disable ADSP_SHMEM || true
          scripts/config --disable MSM_VIDC_V4L2 --disable MSM_VIDC_3X_V4L2 || true
          scripts/config --disable SND_SOC_MSM || true
          scripts/config --disable SLIMBUS || true
          # 关键：关闭模块签名强制 → 未签名第三方 .ko 可加载（MODULE_SIG 保留无害，仅给内核加 taint）
          scripts/config --disable MODULE_SIG_FORCE
          # 诊断用：关闭 panic 强制咬看门狗（硬复位会饿死 pstore 落盘），保证崩溃栈写入 ramoops
          scripts/config --disable QCOM_FORCE_WDOG_BITE_ON_PANIC
          # 诊断用：抓"静默卡死"（屏幕停在橙色解锁警告、USB不通、无panic）。
          # 开启 soft/hard lockup 检测器并设为检测到即 panic —— panic 即走现有热复位链路，
          # RAM保住、自动进fastboot，console区留下卡死瞬间的最后日志与现场。
          # watchdog_thresh默认10：soft lockup 20s触发，hard lockup 10s触发。
          # clean_diag 模式下不启用（干净内核不带这些诊断配置）。
          if [ "${{ inputs.clean_diag }}" != "true" ]; then
            scripts/config --enable DEBUG_KERNEL \
              --enable LOCKUP_DETECTOR \
              --enable BOOTPARAM_SOFTLOCKUP_PANIC \
              --enable BOOTPARAM_HARDLOCKUP_PANIC \
              --enable PANIC_ON_RECURSIVE_FAULT \
              --enable INITCALL_DEBUG || true
          fi
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          if grep -q '^# CONFIG_MODULE_SIG_FORCE is not set' .config; then echo "SIG_FORCE=off"; else echo "SIG_FORCE=STILL ON"; fi
          grep -q '^CONFIG_PSTORE_RAM=y' .config && echo 'PSTORE_RAM=y'
          grep -q '^CONFIG_QCOM_FORCE_WDOG_BITE_ON_PANIC=y' .config && echo 'WDOGBITE=STILL ON' || echo 'WDOGBITE=off'
          grep -q '^CONFIG_MODVERSIONS=y' .config && echo "MODVERSIONS=y" >> "$GITHUB_ENV" || echo "MODVERSIONS=n" >> "$GITHUB_ENV"
          echo '--- lockup detector resolution ---'
          grep -E 'CONFIG_LOCKUP_DETECTOR|CONFIG_HARDLOCKUP_DETECTOR=|SOFTLOCKUP_PANIC_VALUE|HARDLOCKUP_PANIC_VALUE|CONFIG_PANIC_ON_RECURSIVE_FAULT' .config || echo 'LOCKUP CONFIGS MISSING'

      - name: modules_prepare (fast path)
        if: env.MODVERSIONS == 'n'
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION="${{ inputs.localversion }}" modules_prepare

      # sdm845-perf_defconfig 已确认 MODVERSIONS=y：模块必须带符号 CRC，需要整树编出 Module.symvers
      # CC 直指交叉 gcc，绕过 gcc-wrapper.py——它把 GCC11 的新警告强制升级为错误（forbidden warning），
      # 我们只要 Module.symvers/CRC，不刷这个内核，警告无害
      # 两步走：
      #   1) make vmlinux —— dir descent 编译全部 .o(obj-y/obj-m)并链接 vmlinux，不碰公开树裁剪坏的 dtbs
      #   2) make -f scripts/Makefile.modpost —— 默认 _modpost 目标只生成 Module.symvers，
      #      不链接无关内核模块的 .ko（省时间、避坑）
      - name: Full kernel build (only when MODVERSIONS=y)
        if: env.MODVERSIONS == 'y'
        run: |
          cd kernel
          # 打印构建前 ccache 累计统计（用于量化真实命中率，而非只看缓存是否恢复）
          ccache -s || true
          # gcc10+ 默认 -fno-common，4.9 自带 dtc 的 yylloc 会多重定义，host 端加 -fcommon。
          # 可启动内核禁止使用 --warn-unresolved-symbols：未解析符号被掩盖会导致真机早期崩溃。
          # 目标内核用与原厂一致的 Google gcc-4.9（KERNEL_CC/KERNEL_CROSS），避免新 gcc 误编译
          make ARCH=arm64 CROSS_COMPILE="$KERNEL_CROSS" CC="ccache $KERNEL_CC" \
            HOSTCFLAGS="-fcommon" \
            LOCALVERSION="${{ inputs.localversion }}" -j"$(nproc)" vmlinux Image.gz
          # 构建后再打印一次，前后差值即本次命中/未命中数量
          ccache -s || true
          # Image.gz = gzip 压缩的可启动内核（arm64 默认 KERNEL_GZIP，与原厂一致）
          ls -la arch/arm64/boot/Image.gz
          # 独立调用 modpost 时 objtree/srctree 为空会把 Module.symvers 写到根目录，显式指定
          make ARCH=arm64 CROSS_COMPILE="$KERNEL_CROSS" \
            objtree=. srctree=. \
            LOCALVERSION="${{ inputs.localversion }}" -f scripts/Makefile.modpost

      - name: Build lsdriver.ko
        run: |
          make -C kernel M="$PWD/lsdriver" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache aarch64-linux-gnu-gcc" \
            LOCALVERSION="${{ inputs.localversion }}" modules

      - name: Show vermagic
        run: modinfo lsdriver/lsdriver.ko | grep -E 'vermagic|depends' || true

      # 诊断模块：在正常b槽读 IMEM 启动阶段标记。用与内核一致的 gcc-4.9，
      # 使符号 CRC 与真机匹配，避免 insmod 报 version mismatch。
      - name: Build imem_reader.ko
        run: |
          make -C kernel M="$PWD/kernel-patches/imem_reader" ARCH=arm64 \
            CROSS_COMPILE="$KERNEL_CROSS" CC="ccache $KERNEL_CC" \
            LOCALVERSION="${{ inputs.localversion }}" modules
          modinfo kernel-patches/imem_reader/imem_reader.ko | grep -E 'vermagic|depends' || true

      # 用 magiskboot 解包原厂 boot_b.img，只替换 kernel，ramdisk（含 Magisk）/dtb/cmdline 原样保留
      - name: Repack boot.img with new kernel
        run: |
          set -e
          # Magisk apk 内的 lib/x86_64/libmagiskboot.so 就是独立可执行的 magiskboot
          curl -L --retry 3 -o /tmp/magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          (cd /tmp && unzip -o -j magisk.apk lib/x86_64/libmagiskboot.so -d mb && chmod +x mb/libmagiskboot.so)
          MB=/tmp/mb/libmagiskboot.so
          mkdir -p outboot && cd outboot
          cp ../boot/boot_b.img boot.img
          "$MB" unpack boot.img
          echo '--- unpacked files ---'; ls -la
          # 只换内核；若原厂内核尾部追加了 dtb，magiskboot 已拆出 kernel_dtb，repack 时自动接回
          cp ../kernel/arch/arm64/boot/Image.gz kernel
          "$MB" repack boot.img new-boot.img
          # 二分法: 在 boot.img header 的 cmdline(offset 64, 512字节)追加 lsd_initcall_max
          python3 -c '
import sys
f=open("new-boot.img","r+b"); f.seek(64); c=f.read(512)
e=c.find(b"\x00"); old=c[:e].decode()
arg=" lsd_initcall_max=${{ inputs.initcall_max }}"
if "lsd_initcall_max" not in old: old+=arg
nb=old.encode()+b"\x00"*(512-len(old))
f.seek(64); f.write(nb); f.close()
print("cmdline:", old)
'
          ls -la new-boot.img

      - name: Upload patched boot.img
        uses: actions/upload-artifact@v4
        with:
          name: patched-boot-img
          path: outboot/new-boot.img

      - name: Upload lsdriver.ko
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-ko
          path: lsdriver/lsdriver.ko

      - name: Upload imem_reader.ko
        uses: actions/upload-artifact@v4
        with:
          name: imem-reader-ko
          path: kernel-patches/imem_reader/imem_reader.ko

      # 即使 job 失败也保存 ccache：actions/cache 默认只在成功时写缓存，
      # 不加这步会陷入"失败→没缓存→下轮又全量编译"的循环
      - name: Save ccache (even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
